<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Espaces modulables · 2 et 3 novembre 2026</title>
<style>
:root{
  --navy:#0B1C8F; --blue:#2572FF; --red:#E30613; --ink:#111726;
  --grey:#737D90; --light:#EEF2FB; --mid:#D7DFF2; --green:#157A58; --gbg:#ECF8F3;
  --bg:#F6F8FD; --amber:#B47700; --line:#E4EAF6;
  --sh:0 1px 2px rgba(17,23,38,.04), 0 8px 24px -10px rgba(11,28,143,.16);
  --shx:0 2px 6px rgba(17,23,38,.06), 0 22px 48px -18px rgba(11,28,143,.30);
  --r:14px; --r2:10px;
  --ff:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--ff);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;
  background:var(--bg);
  background-image:radial-gradient(70rem 36rem at 12% -10%, rgba(37,114,255,.10), transparent 60%),
                   radial-gradient(52rem 30rem at 98% 2%, rgba(227,6,19,.055), transparent 62%);
  background-attachment:fixed}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}

/* ---------- en-tête ---------- */
header.top{background:transparent}
.brand{display:flex;align-items:center;gap:24px;padding:16px 0 14px}
.brand img{display:block}.brand .rf{height:44px}.brand .ae{height:40px}.brand .lf{height:52px}
.titleblock{position:relative;overflow:hidden;border-radius:var(--r);margin-bottom:10px;
  padding:34px 34px 32px;color:#fff;
  background:linear-gradient(135deg,#0B1C8F 0%,#15339F 42%,#2572FF 100%);
  box-shadow:0 18px 48px -22px rgba(11,28,143,.72)}
.titleblock:before{content:"";position:absolute;right:-90px;top:-130px;width:340px;height:340px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%, rgba(255,255,255,.17), transparent 68%)}
.titleblock:after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--red)}
.kick{position:relative;font-size:10.5px;font-weight:800;letter-spacing:3px;margin:0 0 10px;
  color:#fff;opacity:.72;text-transform:uppercase}
h1{position:relative;font-size:clamp(30px,4.6vw,46px);line-height:1.04;margin:0 0 6px;
  color:#fff;letter-spacing:-1.1px;font-weight:800}
.sub{position:relative;font-size:clamp(16px,2.1vw,20px);font-weight:600;margin:0 0 16px;color:#CBD8FF}
.meta{position:relative;display:inline-flex;align-items:center;gap:8px;font-size:13.5px;margin:0;
  color:#fff;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22);
  border-radius:999px;padding:7px 16px;backdrop-filter:blur(4px)}
.meta b{color:#fff;font-weight:700}

/* ---------- onglets ---------- */
nav.tabs{position:sticky;top:0;z-index:40;padding:10px 0 12px;
  background:linear-gradient(to bottom,var(--bg) 62%,rgba(246,248,253,0));}
.tabrow{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;
  background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px;
  box-shadow:var(--sh)}
.tabrow::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;font:inherit;font-size:14px;font-weight:600;color:var(--grey);
  padding:10px 18px;cursor:pointer;white-space:nowrap;border-radius:999px;transition:.18s}
.tab:hover{color:var(--navy);background:var(--light)}
.tab[aria-selected="true"]{color:#fff;background:linear-gradient(135deg,var(--navy),#2a57d6);
  box-shadow:0 6px 16px -6px rgba(11,28,143,.7)}

/* ---------- pages ---------- */
section.page{display:none;padding:22px 0 90px}
section.page.on{display:block;animation:fade .32s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){section.page.on{animation:none}html{scroll-behavior:auto}}
h2.sec{font-size:clamp(23px,3vw,30px);color:var(--navy);margin:0 0 8px;letter-spacing:-.6px;font-weight:800}
h3.sub2{color:var(--navy);margin:30px 0 13px;font-size:19px;font-weight:700;letter-spacing:-.2px}
p.lead{font-size:16.5px;max-width:70ch;margin:0 0 24px;color:#3D4659}

.synth{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin:0 0 26px;padding:15px 18px;
  background:#fff;border:1px solid var(--line);border-radius:var(--r);font-size:12.5px;box-shadow:var(--sh)}
.bar{flex:1 1 280px;height:10px;border-radius:999px;overflow:hidden;display:flex;min-width:200px;background:var(--light)}
.bar i{display:block;height:100%}
.key{display:flex;align-items:center;gap:7px;font-weight:600;color:#3D4659}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}

/* ---------- frise ---------- */
.tl{position:relative}
.tl:before{content:"";position:absolute;left:84px;top:14px;bottom:14px;width:2px;
  background:linear-gradient(to bottom,transparent,var(--mid) 8%,var(--mid) 92%,transparent)}
@media(max-width:760px){.tl:before{display:none}}
.item{position:relative;padding-left:122px;margin-bottom:14px}
@media(max-width:760px){.item{padding-left:0}}
.when{position:absolute;left:0;top:18px;width:74px;text-align:right;font-weight:700;font-size:14.5px;color:var(--navy)}
.when span{display:block;font-weight:500;font-size:11.5px;color:var(--grey);margin-top:2px}
@media(max-width:760px){.when{position:static;width:auto;text-align:left;margin-bottom:7px;display:flex;gap:10px;align-items:baseline}.when span{display:inline}}
.dotmark{position:absolute;left:77px;top:22px;width:16px;height:16px;border-radius:50%;background:#fff;
  border:3px solid var(--navy);box-shadow:0 0 0 5px var(--bg)}
@media(max-width:760px){.dotmark{display:none}}

/* ---------- cartes ---------- */
.card{position:relative;border:1px solid var(--line);border-radius:var(--r);background:#fff;overflow:hidden;
  box-shadow:var(--sh);transition:box-shadow .22s, transform .22s}
.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--acc,var(--navy));
  opacity:0;transition:opacity .22s}
.card:hover:before,.card.open:before{opacity:1}
.card:hover{box-shadow:var(--shx);transform:translateY(-1px)}
.card.open{box-shadow:var(--shx);transform:none}
.chead{display:flex;align-items:center;gap:13px;padding:17px 19px;cursor:pointer;background:#fff;border:0;
  width:100%;font:inherit;text-align:left;transition:.18s}
.chead:hover{background:var(--light)}
.type{font-size:10px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;padding:6px 11px;
  border-radius:999px;white-space:nowrap}
.ct{font-size:17.5px;font-weight:700;color:var(--navy);flex:1;letter-spacing:-.35px;line-height:1.3}
.chev{color:var(--mid);font-size:12px;transition:.25s}
.card.open .chev{transform:rotate(90deg);color:var(--navy)}
.cbody{display:none;padding:2px 19px 22px}
.card.open .cbody{display:block;animation:fade .26s ease both}

.consigne{position:relative;overflow:hidden;color:#fff;padding:18px 22px;border-radius:var(--r2);margin:0 0 18px;
  background:linear-gradient(135deg,#0B1C8F,#1f44b8)}
.consigne:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--red)}
.consigne b{display:block;font-size:10px;letter-spacing:1.8px;color:#A9BEFF;margin-bottom:7px;font-weight:800}
.consigne p{margin:0;font-size:17px;font-weight:600;line-height:1.46}
.blk{margin-bottom:18px}
.blk h4{margin:0 0 11px;font-size:10px;letter-spacing:1.5px;color:var(--navy);text-transform:uppercase;font-weight:800}
.blk.no h4{color:var(--red)}
.steps{margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;position:relative;padding:0 0 0 40px;margin-bottom:10px;font-size:15.5px}
.steps li:before{content:counter(s);position:absolute;left:0;top:0;width:27px;height:27px;border-radius:50%;
  background:var(--navy);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.rules{margin:0;padding-left:19px;font-size:15px;color:#3D4659}
.rules li{margin-bottom:6px}
.livret{display:inline-block;font-size:12.5px;font-weight:700;color:var(--blue);background:#EAF1FF;
  border:1px solid #D4E2FF;border-radius:999px;padding:6px 14px;margin-bottom:15px}
.acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:6px}
.btn{appearance:none;border:1.5px solid var(--navy);background:#fff;color:var(--navy);font:inherit;font-size:13.5px;
  font-weight:700;padding:9px 17px;border-radius:999px;cursor:pointer;transition:.18s}
.btn:hover{background:var(--navy);color:#fff;transform:translateY(-1px);box-shadow:0 8px 18px -8px rgba(11,28,143,.7)}
.btn.solid{background:linear-gradient(135deg,var(--navy),#2a57d6);color:#fff;border-color:transparent;
  box-shadow:0 8px 18px -10px rgba(11,28,143,.85)}
.btn.solid:hover{filter:brightness(1.1)}
.btn.sm{font-size:12.5px;padding:7px 14px}
.btn.gh{border-color:var(--mid);color:var(--grey);background:#fff}
.btn.gh:hover{background:var(--grey);border-color:var(--grey);color:#fff}
a.miro{font-size:13.5px;font-weight:700;color:#1B1B1B;background:#FFD02F;border-radius:999px;padding:9px 17px;
  text-decoration:none;transition:.18s;box-shadow:0 8px 18px -10px rgba(0,0,0,.5)}
a.miro:hover{filter:brightness(.95);transform:translateY(-1px)}

/* ---- blocs de travail ---- */
.mine{border:1px solid #CFE8DD;border-left:5px solid var(--green);border-radius:var(--r);
  padding:17px 18px;margin:0 0 16px;background:var(--gbg)}
.mine .cols{display:grid;gap:10px}
.colhint{font-size:11.5px;color:#4B6A5E;margin:0 0 10px;padding:9px 11px;background:#fff;border-radius:6px;border:1px dashed #BFE0D4}
.colhint b{color:var(--green)}
.mine h4{margin:0 0 4px;font-size:10px;letter-spacing:1.5px;color:var(--green);text-transform:uppercase}
.mine .hint{margin:0 0 13px;font-size:13.5px;color:#39414E}
.mine .hint b{color:var(--green)}
input[type=text],textarea,select{font:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--mid);
  border-radius:6px;background:#fff;width:100%;transition:.15s}
input[type=text]:focus,textarea:focus,select:focus{outline:0;border-color:var(--green);box-shadow:0 0 0 3px rgba(21,122,88,.14)}
textarea.cell{resize:vertical;overflow-y:auto;line-height:1.45;white-space:pre-wrap;word-break:break-word;
  font-size:14px;padding:10px 12px;display:block}
textarea.cell::placeholder{color:#AAB4C6}
textarea.cell:focus{background:#FFFEF9}
.chars{font-size:10.5px;color:var(--grey);text-align:right;margin:2px 2px 0}
table.w{width:100%;border-collapse:separate;border-spacing:0 7px;table-layout:fixed}
table.w th{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--navy);text-align:left;padding:0 6px 3px}
table.w td{padding:0 4px;vertical-align:top}
td.ck{text-align:center;width:84px;padding-top:11px}
.objhead{display:flex;align-items:baseline;gap:10px;margin:16px 0 8px;padding-top:12px;border-top:1px solid #BFE0D4}
.objhead:first-of-type{border-top:0;padding-top:0;margin-top:4px}
.objhead h5{margin:0;font-size:16px;color:var(--navy);flex:1}
.pistes{display:none;margin:8px 0 2px;background:#fff;border:1px dashed var(--mid);border-radius:6px;padding:11px 13px}
.pistes.on{display:block}
.pistes p{margin:0 0 7px;font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:var(--amber)}
.pistes ul{margin:0;padding-left:18px;font-size:13.5px;color:#39414E}
.pistes li{margin-bottom:5px}
.pistes li b{color:var(--navy)}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.cols2{grid-template-columns:1fr}}
.cols2 h5{margin:0 0 8px;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--navy)}
.saved{margin:8px 0 0;font-size:11.5px;color:var(--green);min-height:14px;font-weight:700}
.eqpick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.eqb{appearance:none;border:1.5px solid var(--mid);background:#fff;color:var(--navy);font:inherit;font-weight:700;
  font-size:13.5px;padding:9px 16px;border-radius:6px;cursor:pointer}
.eqb[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.dispbox{background:#fff;border:1px solid var(--mid);border-radius:6px;padding:13px 14px;margin-bottom:10px}
.dispbox h5{margin:0 0 10px;font-size:15.5px;color:var(--navy)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:10px}
.fgrid .full{grid-column:1/-1}
.fgrid label{display:block;font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--grey);margin-bottom:3px}

/* ---- modules de l'après-midi ---- */
.lev{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-bottom:6px}
.levc{background:#fff;border:1px solid var(--mid);border-left:5px solid var(--blue);border-radius:8px;
  padding:14px 15px;cursor:pointer;transition:.15s}
.levc:hover{box-shadow:var(--sh);transform:translateY(-2px)}
.levc h5{margin:0 0 5px;font-size:16px;color:var(--navy)}
.levc .v{margin:0;font-size:13.5px;color:#39414E}
.levc .more{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--light)}
.levc.on .more{display:block}
.levc.on{border-left-color:var(--green)}
.levc .more p{margin:0 0 7px;font-size:13.5px;color:#39414E}
.levc .more b{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--green);display:block;margin-bottom:2px}
.levc .more .lim b{color:var(--red)}
.cle{background:var(--navy);color:#fff;border-left:6px solid var(--red);border-radius:8px;
  padding:15px 18px;margin:0 0 16px;font-size:15.5px;line-height:1.5}
.cle b{display:block;font-size:10px;letter-spacing:1.8px;color:#9FB4FF;margin-bottom:7px}
.tri3 .q{flex:1 1 100%;margin-bottom:8px}
.tri3 .bs{flex-wrap:wrap}
.why{display:none;flex:1 1 100%;margin-top:9px;padding-top:9px;border-top:1px solid var(--light);
  font-size:13.5px;color:#39414E;font-style:italic}
.trirow.ok .why,.trirow.ko .why{display:block}
.trirow{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--mid);border-radius:8px;
  padding:10px 12px;margin-bottom:8px;flex-wrap:wrap}
.trirow .q{flex:1 1 300px;font-size:14.5px}
.trirow .bs{display:flex;gap:6px}
.trirow button{appearance:none;border:1.5px solid var(--mid);background:#fff;color:var(--grey);font:inherit;border-radius:999px;
  font-size:12.5px;font-weight:700;padding:7px 13px;border-radius:6px;cursor:pointer}
.trirow button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.trirow.ok{border-color:var(--green);background:#F3FBF7}
.trirow.ko{border-color:var(--red);background:#FFF5F5}
.trirow .mk{font-weight:700;font-size:13px}
.trifin{margin-top:10px;background:var(--navy);color:#fff;border-radius:8px;padding:13px 16px;font-size:14.5px;display:none}
.trifin.on{display:block}
.plantabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.plantabs button{appearance:none;border:1.5px solid var(--mid);background:#fff;color:var(--navy);font:inherit;
  font-weight:700;font-size:13.5px;padding:9px 15px;border-radius:6px;cursor:pointer}
.plantabs button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.planbox{background:#fff;border:1px solid var(--mid);border-radius:8px;padding:16px 17px}
.planbox h5{margin:0 0 3px;font-size:18px;color:var(--navy)}
.planbox .pm{margin:0 0 12px;font-size:13px;color:var(--grey)}
.planbox .ouv{display:inline-block;font-size:11.5px;font-weight:700;color:var(--green);background:#EDF7F3;
  border-radius:14px;padding:4px 11px;margin-bottom:12px}
.planbox table{width:100%;border-collapse:collapse;font-size:13px;margin:10px 0}
.planbox th{background:var(--light);color:var(--navy);text-align:left;padding:7px 9px;font-size:11px;letter-spacing:.6px;text-transform:uppercase}
.planbox td{border-top:1px solid var(--light);padding:8px 9px;vertical-align:top}
.planbox td.o{font-weight:700;color:var(--red);white-space:nowrap}
.planbox td.c{font-weight:700;color:var(--blue);white-space:nowrap}
.planbox .nt{margin:8px 0 0;font-size:13px;font-style:italic;color:var(--grey)}
.dlrow{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
a.dl{border-radius:999px;font-size:13px;font-weight:700;color:#fff;background:var(--green);border-radius:6px;padding:9px 15px;text-decoration:none}
a.dl:hover{filter:brightness(1.08)}
.pap{counter-reset:pp;margin:0;padding:0;list-style:none}
.pap li{counter-increment:pp;position:relative;padding:11px 12px 11px 48px;margin-bottom:7px;background:#fff;
  border:1px solid var(--mid);border-radius:8px;font-size:14.5px;cursor:pointer;transition:.14s}
.pap li:before{content:counter(pp);position:absolute;left:12px;top:11px;width:25px;height:25px;border-radius:50%;
  background:var(--navy);color:#fff;font-weight:700;font-size:12.5px;display:flex;align-items:center;justify-content:center}
.pap li.done{background:#F3FBF7;border-color:var(--green);color:#4A6A5E}
.pap li.done:before{background:var(--green);content:"✓"}
.eleag{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:11px;margin-bottom:12px}
.eleac{background:#fff;border:1px solid var(--mid);border-top:4px solid var(--blue);border-radius:8px;padding:13px 14px}
.eleac h5{margin:0 0 6px;font-size:15px;color:var(--navy)}
.eleac p{margin:0;font-size:13.5px;color:#39414E}
a.elea{font-size:13.5px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--blue),#1246c9);border-radius:999px;padding:9px 18px;text-decoration:none;box-shadow:0 8px 18px -10px rgba(37,114,255,.9);transition:.18s}
a.elea:hover{filter:brightness(1.08);transform:translateY(-1px)}
.elbar{height:6px;background:var(--light);border-radius:3px;overflow:hidden;margin:4px 0 13px}
.elbar i{display:block;height:100%;background:var(--green);transition:width .25s}
.elst{border:1px solid var(--mid);border-radius:8px;background:#fff;margin-bottom:8px}
.elst>.h{display:flex;align-items:center;gap:11px;width:100%;padding:11px 13px;background:none;border:0;font:inherit;text-align:left;cursor:pointer}
.elst>.h .n{flex:0 0 26px;height:26px;border-radius:50%;background:var(--light);color:var(--navy);
  font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.elst>.h .tt{flex:1;font-weight:700;font-size:14.5px;color:var(--navy)}
.elst>.h .cv{color:var(--grey);font-size:10px;transition:.18s}
.elst.on>.h .cv{transform:rotate(90deg)}
.elst .b{display:none;padding:0 14px 14px 50px}
.elst.on .b{display:block}
.elst.done{border-color:var(--green);background:#F7FCFA}
.elst.done>.h .n{background:var(--green);color:#fff}
.elck{border:1.5px solid var(--mid);background:#fff;color:var(--grey);font-size:11px;font-weight:700;
  letter-spacing:.6px;text-transform:uppercase;padding:4px 9px;border-radius:5px;white-space:nowrap}
.elst.done .elck{background:var(--green);border-color:var(--green);color:#fff}
.elst .b ol{margin:0 0 11px;padding-left:19px;font-size:13.5px;color:#39414E}
.elst .b ol li{margin-bottom:5px}
.elvig{border-left:4px solid var(--red);background:#FFF5F5;padding:9px 13px;border-radius:0 6px 6px 0;font-size:13.5px;color:#39414E}
.elvig b{display:block;font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--red);margin-bottom:3px}
.ellk{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}
.ellk a{font-size:12.5px;font-weight:700;color:var(--navy);border:1px solid var(--mid);border-radius:999px;
  padding:5px 10px;text-decoration:none;background:#fff}
.ellk a:hover{background:var(--light)}
.eltd{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:10px;margin:0 0 11px}
.eltd>div{border:1px solid var(--mid);border-radius:7px;padding:11px 13px;background:var(--light)}
.eltd h6{margin:0 0 7px;font-size:12px;color:var(--navy);text-transform:uppercase;letter-spacing:1px}
.eltd ul{margin:0;padding-left:16px;font-size:13px;color:#39414E}
.eltd li{margin-bottom:3px}

/* ---- carnet ---- */
.cbox{border:1px solid var(--mid);border-radius:var(--r);padding:15px 17px;margin-bottom:11px;background:#fff;box-shadow:var(--sh)}
.cbox h4{margin:0 0 6px;font-size:15.5px;color:var(--navy)}
.cbox pre{margin:0;white-space:pre-wrap;font:inherit;font-size:14px;color:#39414E}
.cbox.empty pre{color:var(--mid);font-style:italic}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:20px;padding:15px 16px;
  background:#fff;border:1px solid var(--mid);border-radius:var(--r);box-shadow:var(--sh)}

/* ---- salle ---- */
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-bottom:26px}
.scard{background:#fff;border:1px solid var(--mid);border-top:4px solid var(--blue);border-radius:var(--r);padding:16px 17px;box-shadow:var(--sh)}
.scard h3{margin:0 0 7px;font-size:16.5px;color:var(--navy)}
.scard p{margin:0 0 8px;font-size:14px;color:#39414E}
.scard ul{margin:0;padding-left:17px;font-size:13.5px;color:#39414E}
table.t{width:100%;border-collapse:collapse;font-size:14px;margin-bottom:22px;background:#fff;box-shadow:var(--sh);border-radius:var(--r);overflow:hidden}
table.t th{background:var(--navy);color:#fff;text-align:left;padding:10px 13px;font-size:12.5px}
table.t td{border-bottom:1px solid var(--light);padding:10px 13px;vertical-align:top}
table.t td:first-child{font-weight:700;color:var(--navy);background:#FAFBFD}
.src{font-size:12.5px;font-style:italic;color:var(--grey);margin:0 0 14px}
.gen{background:#fff;border:1px solid var(--mid);border-radius:var(--r);padding:18px;margin-bottom:24px;box-shadow:var(--sh)}
.gen label{display:block;font-size:11px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.gen textarea{min-height:110px;resize:vertical}
.passw{overflow-x:auto;margin-top:14px}
.passt{width:100%;border-collapse:collapse;font-size:13.5px;min-width:580px}
.passt th{background:var(--light);color:var(--navy);font-size:11px;letter-spacing:1px;text-transform:uppercase;
  padding:9px 10px;text-align:left;border:1px solid var(--mid);white-space:nowrap}
.passt td{border:1px solid var(--mid);padding:9px 10px;vertical-align:middle}
.passt .pr1 td:first-child{width:34%}
.passt .pr1 b{color:var(--navy);display:block;font-size:13.5px}
.passt .ph{display:block;font-size:11.5px;color:var(--grey);margin-top:3px;font-style:italic}
.passt .pc{text-align:center}
.passt .pc select{width:100%;min-width:106px}
.passt .pr2 td{border-top:0;padding:0 10px 9px;background:#FBFCFE}
.passt .pr2 textarea{margin:0}
.passb{margin-top:18px;background:#FBFCFE;border:1px solid var(--mid);border-radius:var(--r);padding:14px 16px}
.passbh{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--navy);font-weight:700;margin-bottom:12px}
.passbr{display:flex;gap:10px;align-items:flex-end}
.passbc{flex:1;text-align:center}
.passbv{height:76px;display:flex;align-items:flex-end;justify-content:center;margin-bottom:6px}
.passbv span{display:block;width:62%;background:linear-gradient(180deg,var(--blue),var(--navy));border-radius:4px 4px 0 0}
.passbc b{display:block;font-size:12.5px;color:var(--navy)}
.passbc i{display:block;font-size:11px;color:var(--grey);font-style:normal}
.passmc{margin-top:20px;border-top:2px solid var(--light);padding-top:16px}
.passmch b{color:var(--navy);font-size:14px}
.passmch span{display:block;font-size:12.5px;color:var(--grey);margin-top:2px}
.pcol{margin-top:14px}
.pcq{text-align:center}
.pcv{display:inline-block;font-weight:700;font-size:12.5px;padding:3px 9px;border-radius:999px;background:var(--light);color:var(--navy)}
.pcv.v0{background:#FDECEC;color:var(--red)}
.pcv.v1{background:var(--light);color:var(--navy)}
.pcv.v2{background:var(--gbg);color:var(--green)}
.pct{display:block;font-size:11px;color:var(--grey);margin-top:3px}
.pcl{margin:0;padding-left:17px;font-size:12.5px;color:#39414E}
.pcl li{margin:3px 0}
.pcl b{color:var(--navy)}
.impr{display:flex;flex-direction:column;gap:2px;margin-top:14px}
.imprl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:11px 0;border-top:1px solid var(--light)}
.imprl:first-child{border-top:0}
.imprt{flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:2px}
.imprt b{font-size:14px;color:var(--navy)}
.imprt span{font-size:12px;color:var(--grey)}
.gen .row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-top:12px}
.gen select{width:auto}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:16px}
.grp{border:1px solid var(--mid);border-top:4px solid var(--blue);border-radius:6px;padding:11px 13px}
.grp h4{margin:0 0 6px;font-size:11.5px;color:var(--navy);text-transform:uppercase;letter-spacing:1px}
.grp ol{margin:0;padding-left:17px;font-size:14px}

/* ---- références des apports ---- */
.pq{border:1px solid var(--mid);border-left:5px solid var(--navy);border-radius:0 6px 6px 0;
  padding:12px 15px;margin:4px 0 14px;background:#FBFCFE}
.pq>b{display:block;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--navy);margin-bottom:6px}
.pq p{margin:0;font-size:13.5px;line-height:1.6;color:#2A3340}
.pq p b{color:var(--navy)}
.refs{border:1px solid var(--mid);border-left:5px solid var(--red);border-radius:0 6px 6px 0;
  padding:11px 14px;margin:4px 0 14px;background:#fff}
.refs>b{display:block;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--red);margin-bottom:6px}
.refs ul{margin:0;padding-left:17px}
.refs li{font-size:12.5px;line-height:1.5;color:#39414E;margin-bottom:5px}
.sref{display:block;margin-top:5px;font-size:11.5px;color:var(--grey);font-style:italic}

/* ---- énigme répartie ---- */
.jeupick{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 8px;font-size:13px;color:var(--navy);font-weight:700}
.jeupick button{appearance:none;border:1.5px solid var(--mid);background:#fff;color:var(--grey);font:inherit;font-weight:700;
  width:34px;height:34px;border-radius:50%;cursor:pointer}
.jeupick button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.jeubox{border:1px solid var(--mid);border-left:5px solid var(--blue);border-radius:0 6px 6px 0;padding:11px 14px;background:#fff;margin-bottom:12px}
.jeubox p{margin:0 0 7px;font-size:14px;color:#26303F}
.jeubox p:last-child{margin-bottom:0}
.jeubox .vide{color:var(--grey);font-style:italic;font-size:13px}
table.enig{width:100%;border-collapse:collapse;margin-bottom:10px}
table.enig th,table.enig td{border:1px solid var(--mid);padding:5px 6px;font-size:12.5px;text-align:left;vertical-align:middle}
table.enig th{background:var(--light);color:var(--navy);font-size:11px;text-transform:uppercase;letter-spacing:.8px}
table.enig td:first-child,table.enig th:first-child{width:62px;color:var(--navy);font-weight:700}
.enigmk{font-size:13px;font-weight:700;align-self:center}

/* ---- la copie ---- */
.ctit{margin:0 0 7px;font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--navy);font-weight:700}
.copie{border:1px solid var(--mid);border-radius:6px;padding:13px 16px;background:#FCFCFD;font-size:14.5px;line-height:1.65;color:#26303F}
.hint2{margin:4px 0 0;font-size:11.5px;color:var(--grey)}
input.num{width:92px;text-align:center;font-weight:700;font-size:17px}
.critbox{display:none;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-top:11px}
.critbox.on{display:grid}
.critbox>div{border:1px solid var(--mid);border-top:4px solid var(--green);border-radius:7px;padding:10px 12px;background:#fff}
.critbox h6{margin:0 0 5px;font-size:13px;color:var(--navy)}
.critbox p{margin:0;font-size:12.5px;color:#39414E}
h5.mur{margin:18px 0 6px;font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--navy);
  border-top:1px solid var(--mid);padding-top:13px}
.notes{display:grid;gap:9px}
.ntrow{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.ntrow>b{flex:0 0 112px;font-size:11.5px;color:var(--navy);text-transform:uppercase;letter-spacing:.8px}
.ntrow input{width:52px;text-align:center;padding:5px 2px;font-size:13px}
.ntc{display:inline-flex;flex-direction:column;align-items:center;gap:2px}
.ntc em{font-size:9.5px;color:var(--grey);font-style:normal;max-width:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.1}
.ntcmpb{margin:16px 0 0 112px;background:var(--gbg);border:1px solid #BFE3D5;border-radius:var(--r);padding:13px 16px}
.ntcmpr{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:3px 0;font-size:13px}
.ntcmpr span{color:var(--grey)}
.ntcmpr b{color:var(--navy);font-size:14px}
.ntcmpb p{margin:9px 0 0;font-size:13px;color:#2A3340;line-height:1.5}
.ntcmpb p b{color:var(--green)}
.ntstat{font-size:13px;color:#39414E;margin:2px 0 0 112px}
.ntstat b{color:var(--navy)}
.ntbar{position:relative;height:16px;background:var(--light);border-radius:8px;margin:5px 0 0 112px;overflow:hidden}
.ntbar i{position:absolute;top:0;bottom:0;background:var(--blue);opacity:.55}
.ntbar u{position:absolute;top:0;bottom:0;width:2px;background:var(--navy)}

/* ---- radar ---- */
.radwrap{display:grid;grid-template-columns:320px 1fr;gap:16px;align-items:start}
@media(max-width:860px){.radwrap{grid-template-columns:1fr}}
.radsvg{border:1px solid var(--mid);border-radius:8px;background:#fff;padding:6px;position:sticky;top:100px}
@media(max-width:860px){.radsvg{position:static}}
.radsvg .rg{fill:none;stroke:var(--mid);stroke-width:1}
.radsvg .ra{stroke:var(--mid);stroke-width:1}
.radsvg .rp{fill:rgba(37,114,255,.22);stroke:var(--navy);stroke-width:2.2;stroke-linejoin:round}
.radsvg .rd{fill:var(--navy)}
.radsvg .rl{font:700 9.5px Arial,sans-serif;fill:var(--navy)}
.rcb{margin-bottom:10px}
.rcb h6{margin:0 0 5px;font-size:13px;color:var(--navy)}
.rcn{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:6px}
.rcn button{appearance:none;border:1.5px solid var(--mid);background:#fff;font:inherit;text-align:left;
  padding:7px 9px;border-radius:6px;cursor:pointer;color:#39414E}
.rcn button b{display:block;font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--grey);margin-bottom:3px}
.rcn button span{display:block;font-size:11.5px;line-height:1.35}
.rcn button:hover{border-color:var(--navy)}
.rcn button[aria-pressed="true"]{border-color:var(--navy);background:var(--light)}
.rcn button[aria-pressed="true"] b{color:var(--navy)}

/* ---- murs ---- */
.murg{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:11px}
.murc{border:1px solid var(--mid);border-top:4px solid var(--red);border-radius:8px;padding:12px 14px;background:#fff}
.murc .mn{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--red);font-weight:700}
.murc h6{margin:4px 0 6px;font-size:14.5px;color:var(--navy);line-height:1.35}
.murc p{margin:0;font-size:13px;color:#39414E}
.rcons{margin:0 0 10px;font-size:13.5px;color:#39414E;line-height:1.55}

/* ---- inscription ---- */
.idask{border:1px solid var(--mid);border-left:5px solid var(--red);border-radius:0 8px 8px 0;
  background:#fff;padding:15px 18px;margin:18px 0 4px}
.idask h3{margin:0 0 5px;font-size:17px;color:var(--navy)}
.idask p{margin:0 0 11px;font-size:13.5px;color:#39414E;line-height:1.55;max-width:84ch}
.idf{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.idf input{width:auto;min-width:160px;flex:0 1 190px}
.idbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--line);
  border-radius:999px;padding:8px 10px 8px 18px;margin:16px 0 2px;font-size:13px;color:#3D4659;box-shadow:var(--sh)}
.idwho{margin-right:auto}
.idact{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.idmsg{font-size:12.5px;color:var(--green);font-weight:700}
.idbar b{color:var(--navy)}
.cwho{font-size:14px;color:#39414E;margin:0 0 14px;padding-bottom:10px;border-bottom:1px solid var(--mid)}
.cwho b{color:var(--navy)}
.cbtog{display:flex;gap:11px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--grey);margin:0 0 16px}
.cbtog b{color:var(--navy);font-size:15px}
.vide3{color:var(--grey);font-style:italic;font-size:13px}

/* ---- rassemblement des contributions ---- */
.mgcount{font-size:13.5px;color:#39414E;margin:14px 0 10px;padding-bottom:9px;border-bottom:1px solid var(--mid)}
.mgcount b{color:var(--navy);font-size:16px}
.mgday{margin:18px 0 8px;font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--navy)}
.mbox{border:1px solid var(--mid);border-radius:8px;background:#fff;padding:12px 14px;margin-bottom:10px}
.mbox h5{margin:0 0 9px;font-size:14.5px;color:var(--navy);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.mbox h5 span{font-size:10.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;
  color:var(--green);background:var(--gbg);border-radius:4px;padding:3px 8px}
.mwho{border-left:3px solid var(--mid);padding:3px 0 3px 11px;margin-bottom:9px}
.mwho:last-child{margin-bottom:0}
.mwho b{display:block;font-size:12.5px;color:var(--red);margin-bottom:3px}
.mwho pre{margin:0;white-space:pre-wrap;font:inherit;font-size:13.5px;color:#26303F;line-height:1.55}

/* ---- les règles du jeu, en un seul bloc ---- */
.jeu{list-style:none;margin:0;padding:0}
.jeu li{display:flex;gap:11px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--light)}
.jeu li:last-child{border-bottom:0}
.jeu .jd{flex:0 0 62px;text-align:center;font-size:11px;font-weight:700;letter-spacing:.4px;
  background:var(--navy);color:#fff;border-radius:4px;padding:4px 0;margin-top:1px}
.jeu .jd.np{background:none;color:var(--red);border:1px solid var(--mid);text-transform:uppercase;font-size:9.5px;letter-spacing:1px}
.jeu .jt2{flex:1;font-size:14px;line-height:1.55;color:#26303F}

/* ---- mode d'emploi, colonnes de consigne ---- */
.modebox{border:1px solid var(--mid);border-left:5px solid var(--navy);border-radius:0 7px 7px 0;
  padding:11px 14px;background:#fff;margin-bottom:12px}
.modebox>b{display:block;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--navy);margin-bottom:6px}
.modebox ol{margin:0;padding-left:18px}
.modebox li,.modebox p{font-size:13.5px;line-height:1.55;color:#39414E;margin:0 0 5px}
.jt{display:block;font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--blue);margin-bottom:7px}
.colg{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:10px}
.colc{border:1px solid var(--mid);border-top:4px solid var(--navy);border-radius:8px;padding:11px 13px;background:#fff}
.colc .cn{display:inline-flex;width:21px;height:21px;border-radius:50%;background:var(--navy);color:#fff;
  font-size:11px;font-weight:700;align-items:center;justify-content:center}
.colc h6{margin:6px 0 5px;font-size:13.5px;color:var(--navy)}
.colc p{margin:0;font-size:12.5px;color:#39414E;line-height:1.5}

/* ---- feuille de route des murs ---- */
.rolerow{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.rolerow>div{min-width:210px}
.lg{display:block;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--navy);margin-bottom:3px;font-weight:700}
.vide2{font-size:13.5px;color:var(--grey);font-style:italic;margin:0}
.tourb{border:1px solid var(--mid);border-radius:8px;padding:12px 14px;margin-bottom:11px;background:#fff}
.tourh{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.tourh .tn{width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;font-size:12px;
  font-weight:700;display:flex;align-items:center;justify-content:center}
.tourh b{font-size:14.5px;color:var(--navy)}
.tourh .tmin{font-size:11px;font-weight:700;background:var(--light);color:var(--navy);padding:3px 8px;border-radius:4px}
.tourh .tmur{font-size:11px;font-weight:700;background:var(--red);color:#fff;padding:3px 9px;border-radius:4px;
  text-transform:uppercase;letter-spacing:.6px}
.tpb{margin:0 0 7px;font-size:13.5px;font-weight:700;color:#26303F}
.ligne{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:8px;margin-top:8px;
  padding-top:8px;border-top:1px dashed var(--mid)}
.spbox{display:none;border:1px solid var(--mid);border-left:5px solid var(--navy);border-radius:0 7px 7px 0;
  padding:12px 15px;background:#fff;margin-top:10px}
.spbox.on{display:block}
.spbox ol{margin:0;padding-left:19px}
.spbox li{font-size:13.5px;line-height:1.6;color:#39414E;margin-bottom:6px}

/* ---- la trame, moment par moment ---- */
.momc{border:1px solid var(--mid);border-left:4px solid var(--navy);border-radius:0 8px 8px 0;
  padding:11px 13px;margin-bottom:9px;background:#fff}
.momh{display:grid;grid-template-columns:28px minmax(150px,1fr) minmax(200px,1.6fr);gap:10px;align-items:start}
@media(max-width:760px){.momh{grid-template-columns:1fr}}
.momn{font-size:15px;font-weight:700;color:var(--navy);text-align:center;padding-top:6px}
.moms{display:grid;grid-template-columns:repeat(auto-fit,minmax(142px,1fr));gap:8px;margin-top:9px;
  padding-top:9px;border-top:1px solid var(--light)}
.sl{display:block}
.sl span{display:block;font-size:9.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--grey);margin-bottom:3px}
.sl select{width:100%;font-size:12.5px;padding:6px 5px}
.rublab{font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--grey);margin-bottom:3px}

/* ---- contrôles et réparation ---- */
.ctrl{border:1px solid var(--mid);border-left:5px solid var(--grey);border-radius:0 7px 7px 0;
  padding:10px 13px;margin-bottom:8px;background:#fff}
.ctrl.ko{border-left-color:var(--red);background:#FFF7F7}
.ctrl.ok{border-left-color:var(--green);background:#F7FCFA}
.ctrl>b{display:block;font-size:14px;color:var(--navy);margin-bottom:4px}
.ctrl .cd{margin:0 0 6px;font-size:12.5px;color:var(--grey);line-height:1.5}
.ctrl .cv2{margin:0;font-size:13.5px;color:#26303F;line-height:1.55}
.repb{border:1px solid var(--mid);border-radius:8px;padding:11px 13px;margin-bottom:9px;background:#fff}
table.mod td{font-size:12.5px;vertical-align:top}
.tag{display:inline-block;padding:3px 7px;border-radius:4px;color:#fff;font-size:11px;font-weight:700}
.cpt{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 13px}
.kpi{font-size:12px;font-weight:700;padding:6px 11px;border-radius:6px;border:1.5px solid}
.kpi.ok{color:var(--green);border-color:var(--green);background:var(--gbg)}
.kpi.ko{color:var(--red);border-color:var(--red);background:#FFF5F5}

/* ---- protocoles ---- */
.prbox h6{margin:12px 0 5px;font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--navy)}
.prbox ol{margin:0;padding-left:19px;font-size:13.5px;color:#39414E}
.prbox ol li{margin-bottom:5px}
.prbox p{margin:0;font-size:13.5px;color:#39414E;line-height:1.6}
.prg{border-left:4px solid var(--green);background:var(--gbg);padding:9px 12px;border-radius:0 6px 6px 0}
.prc{border-left:4px solid var(--blue);background:#F2F7FF;padding:9px 12px;border-radius:0 6px 6px 0}
.prs{border-left:4px solid var(--navy);background:var(--light);padding:9px 12px;border-radius:0 6px 6px 0}

/* ---- ruban des modalités ---- */
.ruban{display:flex;gap:3px;height:40px;margin:2px 0 4px}
.ruban span{flex:1;border-radius:4px;display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;color:#fff;letter-spacing:.4px;overflow:hidden;text-align:center;padding:0 2px}
.ruban span.vide{background:var(--light);color:var(--grey);border:1px dashed var(--mid)}
.rubmsg{margin:0 0 12px;font-size:12.5px;font-weight:700;min-height:17px}
table.sc td.sn{width:26px;text-align:center;font-weight:700;color:var(--navy);background:var(--light)}
table.w select{width:100%;font-size:12.5px;padding:6px 5px}

/* ---- minuteur, dans le bouton ---- */
.tkb{font-variant-numeric:tabular-nums;min-width:108px;text-align:center}
.tkb.tk,.tkb.tk:hover{background:var(--navy);border-color:var(--navy);color:#fff}
.tkb.tk.fin,.tkb.tk.fin:hover{background:var(--red);border-color:var(--red);color:#fff}

.qz{position:fixed;inset:0;background:#fff;z-index:110;display:none;flex-direction:column;padding:20px 28px 18px}
.qz.on{display:flex}
.qzhead{display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid var(--mid);padding-bottom:11px}
.qzhead b{color:var(--red);font-size:11.5px;letter-spacing:2px}
.prog{flex:1;height:6px;background:var(--light);border-radius:3px;overflow:hidden;max-width:360px}
.prog i{display:block;height:100%;background:var(--navy);transition:width .25s}
.qzbody{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:980px;margin:0 auto;width:100%;overflow-y:auto;padding:14px 0}
.qq{font-size:clamp(20px,3vw,34px);font-weight:700;color:var(--navy);line-height:1.2;margin:0 0 24px}
.qopts{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.qopt{border:2px solid var(--mid);border-radius:8px;padding:14px 18px;font-size:clamp(15px,1.7vw,20px);font-weight:700;
  color:#39414E;background:#fff;cursor:pointer;text-align:left;font-family:inherit;transition:.14s}
.qopt:hover{border-color:var(--navy);background:var(--light)}
.qopt[aria-pressed="true"]{border-color:var(--navy);background:var(--navy);color:#fff}
.qopt.good{border-color:var(--green);background:var(--gbg);color:var(--green);cursor:default}
.qopt.bad{opacity:.35;cursor:default}
.qopt.mine2{box-shadow:0 0 0 3px rgba(227,6,19,.35)}
.qexp{border-left:5px solid var(--navy);background:var(--light);padding:14px 18px;border-radius:8px;font-size:clamp(14px,1.4vw,17px)}
.qexp .qd{display:block;margin-top:10px;font-weight:700;color:var(--navy)}
.qexp .qs{display:block;margin-top:8px;font-size:12.5px;font-style:italic;color:var(--grey)}
.qzfoot{display:flex;gap:10px;justify-content:center;padding-top:14px;flex-wrap:wrap;border-top:1px solid var(--light)}
.qend{text-align:center}
.qend h3{font-size:clamp(22px,3vw,34px);color:var(--navy);margin:0 0 12px}
.qend p{font-size:17px;color:#39414E;margin:0 0 6px}

footer{border-top:1px solid var(--mid);padding:22px 0 60px;font-size:13px;color:var(--grey);background:#fff}

@media print{
  body{background:#fff!important;background-image:none!important}
  .titleblock{background:#fff!important;color:var(--ink)!important;box-shadow:none!important;padding:0 0 14px!important;border-bottom:2px solid var(--navy)}
  .titleblock:before,.titleblock:after{display:none!important}
  h1{color:var(--navy)!important}.sub{color:var(--ink)!important}
  .kick{color:var(--red)!important;opacity:1}
  .meta{background:none!important;border:0!important;color:var(--grey)!important;padding:0!important}
  .card{box-shadow:none!important;break-inside:avoid}
  .consigne{background:#fff!important;color:var(--ink)!important;border:1px solid var(--mid)}
  .consigne b{color:var(--red)!important}

  nav.tabs,.acts,.toolbar,.qz,.gen,.eqpick{display:none!important}
  section.page{display:block!important;page-break-before:always}
  .cbody{display:block!important}.card{break-inside:avoid;box-shadow:none}
  body{background:#fff;font-size:11pt}
}
</style>

let F={};
function loadF(){try{F=JSON.parse(localStorage.getItem("em2")||"{}")||{};}catch(e){F={};}}
function saveF(){try{localStorage.setItem("em2",JSON.stringify(F));}catch(e){}}
const V=k=>F[k]||"";
function inp(k,ph){return `<input type="text" data-f="${k}" placeholder="${esc(ph||"")}">`;}
function ta(k,ph,h){return `<textarea class="cell" rows="3" style="min-height:${h||78}px" data-f="${k}" placeholder="${esc(ph||"")}"></textarea>`;}

function tabs(){
  document.getElementById("tabrow").innerHTML=PAGES.map((p,i)=>
    `<button class="tab" role="tab" aria-selected="${i===0}" data-go="${p.id}">${esc(p.tab)}</button>`).join("");
}
function synth(j){
  const tot=j.seq.reduce((a,s)=>a+s.d,0),by={};
  j.seq.forEach(s=>by[s.type]=(by[s.type]||0)+s.d);
  const o=["atelier","apport","echange","bilan","pause"].filter(t=>by[t]);
  return `<div class="synth"><b>${tot} minutes</b><div class="bar">`+
   o.map(t=>`<i style="width:${(by[t]/tot*100).toFixed(1)}%;background:${TYPES[t].c}"></i>`).join("")+`</div>`+
   o.map(t=>`<span class="key"><span class="dot" style="background:${TYPES[t].c}"></span>${TYPES[t].l} ${by[t]}′</span>`).join("")+`</div>`;
}

      const O=OBJECTIFS[key];

      for(let i=0;i<4;i++) rows+=`<tr><td style="width:46%">${ta("g-"+key+"-"+i+"-m","Modalité "+(i+1)+" : ce que font les élèves, concrètement",80)}</td>

/* ---- la passation : quatre critères × quatre niveaux ---- */
const pkey=(c,j)=>"PA-"+c+"-"+j;
function passScore(G){
  /* 0 = l'enseignant décide, 2 = l'élève décide. Somme par niveau. */
  const s=[0,0,0,0]; let n=0;
  PASS_CRIT.forEach(c=>PASS_NIV.forEach((x,j)=>{
    const v=G[pkey(c.k,j)]; if(v===undefined||v==="")return; s[j]+=+v; n++;}));
  return {s:s,n:n};
}
function passBar(){
  const r=passScore(F);
  if(r.n<4) return `<p class="hint" style="margin:12px 0 0">Complétez les quatre niveaux d'un critère au moins : la courbe de passation apparaîtra ici.</p>`;
  const max=PASS_CRIT.length*2;
  return `<div class="passb"><div class="passbh">Ce que l'élève décide, de la 6e à la terminale</div>
   <div class="passbr">${PASS_NIV.map((x,j)=>{
     const h=Math.round(r.s[j]/max*100);
     return `<div class="passbc"><div class="passbv"><span style="height:${Math.max(h,3)}%"></span></div>
       <b>${esc(x)}</b><i>${r.s[j]} / ${max}</i></div>`;}).join("")}</div>
   <p class="hint" style="margin:10px 0 0">${r.s[3]>r.s[0]
     ? "La courbe monte : c'est la passation. Reste à dire, critère par critère, ce qui la rend tenable."
     : "La courbe ne monte pas. Soit vous décrivez un transfert qui n'a pas lieu, soit il passe par autre chose que ces quatre critères : dites lequel."}</p></div>`;
}

let PASSC=[];
function passRender(){
  const box=document.getElementById("pcbox"); if(!box)return;
  if(!PASSC.length){box.innerHTML="";return;}
  box.innerHTML=`<table class="passt pcol">
   <thead><tr><th>Le critère</th>${PASS_NIV.map(x=>`<th>${esc(x)}</th>`).join("")}</tr></thead>
   <tbody>${PASS_CRIT.map(c=>{
     const cells=PASS_NIV.map((x,j)=>{
       const tal=[0,0,0];
       PASSC.forEach(m=>{const v=m.F[pkey(c.k,j)]; if(v!==undefined&&v!=="")tal[+v]++;});
       const tot=tal[0]+tal[1]+tal[2];
       if(!tot) return `<td class="pcq"><span class="pcv">—</span></td>`;
       const hi=tal.indexOf(Math.max.apply(null,tal));
       const acc=tal[hi]===tot;
       return `<td class="pcq"><span class="pcv v${hi}">${esc(PASS_REP[hi])}</span>
         <span class="pct">${tal[hi]} / ${tot}${acc?" : unanime":""}</span></td>`;}).join("");
     const conds=PASSC.map(m=>(m.F["PA-"+c.k+"-c"]||"").trim()).filter(Boolean);
     return `<tr class="pr1"><td><b>${esc(c.t)}</b></td>${cells}</tr>`+
       (conds.length?`<tr class="pr2"><td colspan="${PASS_NIV.length+1}"><ul class="pcl">${
         conds.map((t,i)=>`<li><b>${esc(PASSC.filter(m=>(m.F["PA-"+c.k+"-c"]||"").trim())[i].nom)}</b> : ${esc(t)}</li>`).join("")}</ul></td></tr>`:"");
   }).join("")}</tbody></table>`;
}
async function passAdd(files){
  let n=0,bad=0;
  for(const f of Array.from(files)){
    try{const G=JSON.parse(await f.text());
      const nom=((G["ID-p"]||"")+" "+(G["ID-n"]||"")).trim()||f.name.replace(/\.json$/i,"");
      PASSC=PASSC.filter(m=>m.nom!==nom); PASSC.push({nom:nom,F:G}); n++;
    }catch(e){bad++;}
  }
  PASSC.sort((a,b)=>a.nom.localeCompare(b.nom,"fr"));
  passRender();
  const m=document.getElementById("pcmsg");
  if(m)m.textContent=PASSC.length+" contribution"+(PASSC.length>1?"s":"")+(bad?" : "+bad+" fichier illisible":"");
}

function radarSvg(){
  const n=COOP_CRIT.length,R=88,cx=150,cy=118;
  const ang=i=>-Math.PI/2+i*2*Math.PI/n;
  const pt=(i,r)=>[cx+Math.cos(ang(i))*r,cy+Math.sin(ang(i))*r];
  const poly=r=>Array.from({length:n},(_,i)=>pt(i,r).map(v=>v.toFixed(1)).join(",")).join(" ");
  let g="";
  for(let L=1;L<=4;L++) g+=`<polygon class="rg" points="${poly(R*L/4)}"/>`;
  for(let i=0;i<n;i++){const p=pt(i,R);g+=`<line class="ra" x1="${cx}" y1="${cy}" x2="${p[0].toFixed(1)}" y2="${p[1].toFixed(1)}"/>`;}
  const vals=COOP_CRIT.map((c,i)=>(F["RC-"+i]===undefined||F["RC-"+i]==="")?null:(+F["RC-"+i]+1));
  let pl="";
  if(vals.some(v=>v!==null)){
    pl=`<polygon class="rp" points="${vals.map((v,i)=>pt(i,R*(v||0.3)/4).map(x=>x.toFixed(1)).join(",")).join(" ")}"/>`;
    vals.forEach((v,i)=>{if(v){const p=pt(i,R*v/4);pl+=`<circle class="rd" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.4"/>`;}});
  }
  let lab="";
  COOP_CRIT.forEach((c,i)=>{const p=pt(i,R+18);
    lab+=`<text class="rl" x="${p[0].toFixed(1)}" y="${(p[1]+3).toFixed(1)}" text-anchor="middle">${esc(c.c)}</text>`;});
  return `<svg viewBox="0 0 300 248" width="100%" role="img" aria-label="Radar du degré de coopération">${g}${pl}${lab}</svg>`;
}

function diagSeq(rows){
  const m=rows.map(r=>r.m),b=rows.map(r=>r.b),e=rows.map(r=>r.e),d=rows.map(r=>r.d);
  let trop=false;
  for(let i=2;i<m.length;i++) if(m[i]!==null&&m[i]===m[i-1]&&m[i]===m[i-2]) trop=true;
  let chg=0;for(let i=1;i<d.length;i++) if(d[i]!==null&&d[i-1]!==null&&d[i]!==d[i-1]) chg++;
  const uniq=a=>a.filter((x,i)=>x!==null&&a.indexOf(x)===i).length;
  return {n:rows.length, trop:trop, nmod:uniq(m), nabc:uniq(rows.map(r=>r.a)),
    ecrits:m.filter(x=>x!==null).length,
    haut:b.filter(x=>x!==null&&x>=3).length,
    pairs:e.filter(x=>x!==null&&x>=2).length,
    chg:chg};
}
function rubMsg(d){
  if(d.trop) return ["Trois moments consécutifs dans la même modalité : c'est là que l'attention décroche.","var(--red)"];
  if(d.ecrits>=4&&d.nmod<=2) return ["Deux modalités seulement sur quatre : on alterne entre le cours et le travail individuel, et jamais les élèves ne travaillent ensemble.","var(--red)"];
  if(d.ecrits>=4) return ["L'alternance tient : "+d.nmod+" modalités sur "+d.ecrits+" moments.","var(--green)"];
  return ["",""];
}

function txt(ji,si,s){
  const k=ji+"-"+si,L=[];
  if(s.form==="ressources"){for(let i=0;i<6;i++){const r=V(k+"-r"+i).trim();if(!r)continue;
    L.push("• "+r+(V(k+"-u"+i).trim()?" : "+V(k+"-u"+i).trim():"")+(F[k+"-j"+i]?" : jamais utilisée":""));}}
  if(s.grille&&F["eq"]!==undefined&&F["eq"]!==""){
    EQUIPES[+F["eq"]].obj.forEach(key=>{
      const sub=[];
      for(let i=0;i<4;i++){const m=V("g-"+key+"-"+i+"-m").trim();if(!m)continue;
        sub.push("   – "+m+" | "+V("g-"+key+"-"+i+"-d").trim()+" | "+V("g-"+key+"-"+i+"-x").trim());}
      if(sub.length) L.push(OBJECTIFS[key].t+"\n"+sub.join("\n"));});
  }
  if(s.colonnes){
    ["a","b"].forEach((side,n)=>{const sub=[];
      for(let i=0;i<6;i++){const v=V("c-"+k+"-"+side+"-"+i).trim();if(v)sub.push("   – "+v);}
      if(sub.length)L.push(s.colonnes[n]+"\n"+sub.join("\n"));});
  }
  if(s.passation){
    PASS_CRIT.forEach(c=>{
      const cols=PASS_NIV.map((x,j)=>{const v=F[pkey(c.k,j)];
        return x+" : "+((v===undefined||v==="")?"—":PASS_REP[+v]);});
      const cond=V("PA-"+c.k+"-c").trim();

function statNotes(){
  ["NA","NB"].forEach(p=>{
    const st=document.getElementById("st-"+p),bar=document.getElementById("bar-"+p);if(!st)return;
    const v=[];for(let i=0;i<15;i++){const x=F[p+"-"+i];if(x!==undefined&&x!=="")v.push(+x);}
    if(v.length<2){st.textContent="—";if(bar)bar.innerHTML="";return;}
    const mn=Math.min.apply(null,v),mx=Math.max.apply(null,v),mo=v.reduce((a,b)=>a+b,0)/v.length;
    const ec=Math.sqrt(v.reduce((a,b)=>a+(b-mo)*(b-mo),0)/v.length);
    st.innerHTML=v.length+" notes · de <b>"+mn+"</b> à <b>"+mx+"</b> · étendue <b>"+(mx-mn).toFixed(1)+
      " points</b> · moyenne "+mo.toFixed(1)+" · écart-type "+ec.toFixed(2);
    if(bar)bar.innerHTML=`<i style="left:${(mn/20*100).toFixed(1)}%;width:${Math.max(1,(mx-mn)/20*100).toFixed(1)}%"></i>`+
      `<u style="left:${(mo/20*100).toFixed(1)}%"></u>`;
  });
  ntCmp();
}
function ntVals(p){const v=[];for(let i=0;i<15;i++){const x=F[p+"-"+i];if(x!==undefined&&x!=="")v.push(+x);}return v;}
function ntCmp(){
  const box=document.getElementById("ntcmp"); if(!box)return;
  const a=ntVals("NA"),b=ntVals("NB");
  if(a.length<2||b.length<2){box.innerHTML="";return;}
  const et=v=>Math.max.apply(null,v)-Math.min.apply(null,v);
  const ea=et(a),eb=et(b),d=ea-eb;
  const pc=ea?Math.round(d/ea*100):0;
  const msg = d>0
    ? "L'étendue s'est resserrée de <b>"+d.toFixed(1)+" points</b>, soit "+pc+" %. Ce n'est pas la copie qui a changé : c'est que nous avons regardé la même chose. Voilà ce qu'une grille partagée fait au jugement — et voilà, du même coup, ce que l'élève gagne à l'avoir avant de rendre, et non après."
    : d===0
    ? "L'étendue n'a pas bougé. Deux lectures possibles : la grille redit ce que vous faisiez déjà implicitement, ou elle est trop lâche pour trancher. Regardez sur quel critère vous divergez encore."
    : "L'étendue s'est <b>élargie</b> de "+Math.abs(d).toFixed(1)+" points. C'est rare et instructif : la grille a rendu visible un désaccord que la note globale masquait. C'est précisément ce qu'elle doit faire.";
  box.innerHTML=`<div class="ntcmpb">
    <div class="ntcmpr"><span>Sans critères</span><b>${ea.toFixed(1)} pts d'étendue</b></div>
    <div class="ntcmpr"><span>Avec la grille</span><b>${eb.toFixed(1)} pts d'étendue</b></div>
    <p>${msg}</p></div>`;
}
async function ntAdd(files){
  let n=0,bad=0,i=0;
  const lus=[];
  for(const f of Array.from(files)){
    try{const G=JSON.parse(await f.text());
      const nom=((G["ID-p"]||"")+" "+(G["ID-n"]||"")).trim()||f.name.replace(/\.json$/i,"");
      lus.push({nom:nom,a:G["N1"],b:G["N2"]}); n++;
    }catch(e){bad++;}
  }
  lus.sort((x,y)=>x.nom.localeCompare(y.nom,"fr"));
  for(let k=0;k<15;k++){delete F["NA-"+k];delete F["NB-"+k];delete F["NM-"+k];}
  lus.forEach(x=>{if(i>=15)return;
    if(x.a!==undefined&&x.a!=="")F["NA-"+i]=x.a;
    if(x.b!==undefined&&x.b!=="")F["NB-"+i]=x.b;
    F["NM-"+i]=x.nom.split(" ")[0]||x.nom; i++;});
  saveF();
  const box=document.querySelector(".mine .notes");
  if(box){const card=box.closest(".mine");card.outerHTML=wCopie();fillF();statNotes();}
  const m=document.getElementById("ntmsg");
  if(m)m.textContent=n+" contribution"+(n>1?"s":"")+" chargée"+(n>1?"s":"")+(bad?" : "+bad+" fichier illisible":"");
}

function shuffle(){
  const n=document.getElementById("noms").value.split("\n").map(s=>s.trim()).filter(Boolean);
  for(let i=n.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[n[i],n[j]]=[n[j],n[i]];}
  const v=document.getElementById("taille").value;
  const nb=v.startsWith("g")?+v.slice(1):Math.max(1,Math.ceil(n.length/+v));
  const g=Array.from({length:nb},()=>[]);n.forEach((x,i)=>g[i%nb].push(x));
  document.getElementById("groupes").innerHTML=g.map((x,i)=>
    `<div class="grp"><h4>Groupe ${i+1} : ${x.length}</h4><ol>${x.map(y=>`<li>${esc(y)}</li>`).join("")}</ol></div>`).join("");
}

  const ah=e.target.closest("[data-acc]");
  if(ah){ah.closest(".elst").classList.toggle("on");return;}
  const pp=e.target.closest("[data-pap]");
  if(pp){const k2="P-"+pp.dataset.pap;F[k2]=!F[k2];saveF();pp.classList.toggle("done",!!F[k2]);return;}
  const pi=e.target.closest("[data-pist]");
  if(pi){const b=document.getElementById("pi-"+pi.dataset.pist);b.classList.toggle("on");
    pi.textContent=b.classList.contains("on")?"Masquer les pistes":"Ouvrir les pistes";return;}
  const op=e.target.closest("[data-opt]");
  if(op){F["Q-"+qi]=+op.dataset.opt;saveF();drawQuiz();setTimeout(()=>{qi++;drawQuiz();},320);return;}
  const cp=e.target.closest("[data-copy]");
  if(cp){const k=cp.dataset.copy,L=[];
    for(let i=0;i<6;i++){const r=V(k+"-r"+i).trim();if(!r)continue;
      L.push(r+(V(k+"-u"+i).trim()?" : "+V(k+"-u"+i).trim():"")+(F[k+"-j"+i]?" (jamais utilisée)":""));}
    if(!L.length){alert("Rien à copier pour l'instant.");return;}
    const txt2=L.join("\n");
    if(navigator.clipboard&&navigator.clipboard.writeText)
      navigator.clipboard.writeText(txt2).then(()=>{cp.textContent="Copié !";setTimeout(()=>cp.textContent="Copier ma liste pour Miro",2500);},
        ()=>alert(txt2));
    else alert(txt2);
    return;}
  if(e.target.id==="qNext"){qi++;drawQuiz();return;}
  if(e.target.id==="qPrev"){qi=Math.max(0,qi-1);drawQuiz();return;}
  if(e.target.id==="qClose"){qz.classList.remove("on");renderCarnet();return;}
  if(e.target.id==="exMd"){dl("carnet-"+slug()+".md",carnetMd(),"text/markdown;charset=utf-8");return;}
  if(e.target.id==="exJson"){dl("carnet-"+slug()+".json",JSON.stringify(F,null,2),"application/json");return;}
  if(e.target.id==="cbAll"){F["cbAll"]=!F["cbAll"];saveF();renderCarnet();return;}
  if(e.target.id==="imJson"){document.getElementById("fileJson").click();return;}
  if(e.target.id==="mgPick"){document.getElementById("mgFiles").click();return;}
  if(e.target.id==="pcPick"){document.getElementById("pcFiles").click();return;}
  if(e.target.id==="ntPick"){document.getElementById("ntFiles").click();return;}
  if(e.target.id==="ntRaz"){for(let k=0;k<15;k++){delete F["NA-"+k];delete F["NB-"+k];delete F["NM-"+k];}
    saveF();const b=document.querySelector(".mine .notes");
    if(b){const c=b.closest(".mine");c.outerHTML=wCopie();fillF();statNotes();}
    const m=document.getElementById("ntmsg");if(m)m.textContent="Relevé vidé.";return;}
  if(e.target.id==="pcRaz"){PASSC=[];passRender();
    const m=document.getElementById("pcmsg");if(m)m.textContent="Vidé.";return;}
  if(e.target.id==="mgMd"){if(!MERGE.length){msg2("Aucun fichier déposé.");return;}
    dl("contributions-espaces-modulables.md",mergeMd(),"text/markdown;charset=utf-8");return;}
  if(e.target.id==="mgDoc"){if(!MERGE.length){msg2("Aucun fichier déposé.");return;}mergeDocx();return;}
  if(e.target.id==="mgRaz"){MERGE=[];renderMerge();msg2("Vidé.");return;}
  if(e.target.id==="idGo"){F["ID-ok"]=1;saveF();
    document.getElementById("idzone").innerHTML=idBar();renderCarnet();return;}
  if(e.target.id==="idEdit"){F["ID-ok"]=0;saveF();
    document.getElementById("idzone").innerHTML=idBar();fillF();return;}
  if(e.target.id==="clNotes"){if(confirm("Effacer tout ce que vous avez saisi ?")){F={};saveF();render();fillF();renderCarnet();go("carnet");}return;}
  if(e.target.id==="dlPdt"){exportPdt();return;}
  if(e.target.id==="shuffle"){shuffle();return;}
});
document.addEventListener("keydown",e=>{
  if(qz.classList.contains("on")){
    if(e.key==="Escape")qz.classList.remove("on");
    if(e.key==="ArrowRight"){qi++;drawQuiz();}
    if(e.key==="ArrowLeft"){qi=Math.max(0,qi-1);drawQuiz();}
    return;}
});

loadF();tabs();render();fillF();renderCarnet();renderMerge();ruban();statNotes();
</script>
</body>
</html>
